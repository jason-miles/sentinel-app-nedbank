command:
  - "uvicorn"
  - "app:app"
  - "--host"
  - "0.0.0.0"
  - "--port"
  - "8000"

env:
  - name: FRAUD_CATALOG
    value: "elexon_app_for_settlement_acc_catalog"
  - name: FRAUD_GOLD_SCHEMA
    value: "nedbank_fraud_aml_gold"
  - name: FRAUD_SILVER_SCHEMA
    value: "nedbank_fraud_aml_silver"
  # Serving warehouse the app queries run on. Shared workspace warehouse is fine
  # (queries are schema-scoped to nedbank_fraud_aml_*); override if isolating.
  - name: FRAUD_WAREHOUSE_ID
    value: "e227fa247dd5bedd"
  # Nedbank-specific Genie space + dashboard, both pointed at nedbank_fraud_aml_* and
  # provisioned during deployment (placeholders — set to the real IDs after creating
  # them; see DEPLOY.md step 4).
  - name: SENTINEL_GENIE_SPACE
    value: "REPLACE_WITH_NEDBANK_GENIE_SPACE_ID"
  - name: SENTINEL_DASHBOARD_ID
    value: "REPLACE_WITH_NEDBANK_DASHBOARD_ID"
  - name: DATABRICKS_HOST
    value: "https://fevm-elexon-app-for-settlement-acc.cloud.databricks.com"
